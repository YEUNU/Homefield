[project]
name = "homefield"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["internal"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
