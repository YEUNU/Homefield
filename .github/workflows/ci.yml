name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  no-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: data/ 와 .env 커밋 금지
        run: |
          if git ls-files | grep -E '^(data/|\.env$)'; then echo "금지된 파일이 추적된다"; exit 1; fi
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tests
        run: |
          if [ -d tests ]; then pip install -q pytest && pytest -q; else echo "tests/ 없음 - 건너뜀"; fi
